<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div id="display">416413164</div>
        <div id="buttonsContainer">
            <div class="buttons">
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div class="opButtons">+</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div class="opButtons">-</div>
                <div>1</div>
                <div>2</div>
                <div>2</div>
                <div class="opButtons">*</div>
                <div id="clearButton">Clear</div>
                <div>0</div>
                <div class="opButtons">=</div>
                <div class="opButtons">/</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
