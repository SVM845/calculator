<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div id="display"></div>
        <div id="buttonsContainer">
            <div class="buttons">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="opButtons">+</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="opButtons">-</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="opButtons">*</button>
                <button id="clearButton">Clear</button>
                <button>0</button>
                <button class="opButtons">=</button>
                <button class="opButtons">/</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
